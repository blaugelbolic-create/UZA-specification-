<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1900" viewBox="0 0 2800 1900" role="img" aria-labelledby="title desc">
  <title id="title">Der lebendige Zusammenhang – formaler Arbeitsstand</title>
  <desc id="desc">Präzise Architekturübersicht mit typisiertem Kern, ontologischen Grundannahmen, formalen Modulen, Spezialisierungen, Metatheorie und ausgeschlossenen Fehlschlüssen.</desc>
  <defs>
    <style>
      .bg { fill:#F6F8FB; }
      .panel { fill:#FFFFFF; stroke:#CAD5E2; stroke-width:2.5; }
      .core { fill:#EAF1F8; stroke:#173B57; stroke-width:3; }
      .sem { fill:#E7F5F7; stroke:#0B7285; stroke-width:2.5; }
      .formal { fill:#EDF8EF; stroke:#2B8A3E; stroke-width:2.5; }
      .meta { fill:#F2EEFC; stroke:#6741D9; stroke-width:2.5; }
      .instance { fill:#FFF4E6; stroke:#E67700; stroke-width:2.5; }
      .primitive { fill:#FFF8DB; stroke:#C88A00; stroke-width:3; stroke-dasharray:12 8; }
      .candidate { fill:#F4FAF5; stroke:#5C940D; stroke-width:2.5; stroke-dasharray:10 7; }
