      .h2 { font:700 24px 'DejaVu Sans',sans-serif; fill:#102A43; }
      .h3 { font:700 20px 'DejaVu Sans',sans-serif; fill:#102A43; }
      .body { font:400 18px 'DejaVu Sans',sans-serif; fill:#243B53; }
      .small { font:400 15.5px 'DejaVu Sans',sans-serif; fill:#486581; }
      .tiny { font:400 13.5px 'DejaVu Sans',sans-serif; fill:#627D98; }
      .formula { font:400 18px 'DejaVu Sans Mono',monospace; fill:#102A43; }
      .formulaSmall { font:400 15.5px 'DejaVu Sans Mono',monospace; fill:#102A43; }
      .badge { font:700 14px 'DejaVu Sans',sans-serif; }
      .white { fill:#FFFFFF; }
      .green { fill:#2B8A3E; }
      .amber { fill:#9C6500; }
      .red { fill:#C92A2A; }
      .purple { fill:#6741D9; }
